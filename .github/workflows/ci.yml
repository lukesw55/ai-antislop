name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover tests -v
      - name: Self-scan (no BLOCK findings allowed)
        run: python3 anti-slop/scripts/scan_repo_slop.py . --fail-on-block
